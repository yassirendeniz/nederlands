
  <!DOCTYPE html>
  <html>
  <head>
      <meta charset="UTF-8">
      <title>Quiz</title>
      <style>
          body { font-family: sans-serif; text-align: center; background: #eee; padding: 20px; }
          #quiz-app { background: white; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 10px; border:
  1px solid #ccc; }
          .btn { background: blue; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; font-size:
  18px; margin-top: 10px; border-radius: 5px; }
          .word { display: inline-block; padding: 5px; margin: 3px; border: 1px solid #ccc; cursor: pointer; }
          .selected { background: blue; color: white; }
          .feedback { margin: 15px 0; padding: 10px; display: none; text-align: left; border-radius: 5px; }
          .goed { background: #dfd; color: green; }
          .fout { background: #fdd; color: red; }
          .optie { display: block; width: 100%; padding: 10px; margin: 5px 0; text-align: left; cursor: pointer; }
      </style>
  </head>
  <body>

  <div id="quiz-app">
      <!-- START -->
      <div id="scherm-start">
          <h1>Grammatica Quiz</h1>
          <p>Lidwoorden, Zelfstandige naamwoorden en Bijvoeglijke naamwoorden.</p>
          <button id="knop-start" class="btn">START DE QUIZ</button>
      </div>

      <!-- VRAAG -->
      <div id="scherm-vraag" style="display:none">
          <p>Vraag <span id="v-num">1</span> van 20</p>
          <p id="v-tekst" style="font-weight:bold"></p>
          <div id="v-gebied"></div>
          <div id="v-feedback" class="feedback"></div>
          <button id="knop-actie" class="btn">Controleren</button>
      </div>

      <!-- EINDE -->
      <div id="scherm-einde" style="display:none">
          <h1>Klaar!</h1>
          <p>Je score is: <span id="eind-score"></span></p>
          <button onclick="location.reload()" class="btn">Opnieuw</button>
      </div>
  </div>

  <script>
  // We gebruiken alleen simpele variabelen en functies
  var vragen = [
      {t: "id", i: "Klik op de 3 ZELFSTANDIGE NAAMWOORDEN:", s: "De jonge voetballer trapte de bal over het witte hek",
  a: ["voetballer", "bal", "hek"]},
      {t: "id", i: "Klik op alle BIJVOEGLIJKE NAAMWOORDEN:", s: "In de grote rugzak zaten twee zware dikke boeken", a:
  ["grote", "zware", "dikke"]},
      {t: "id", i: "Klik op alle LIDWOORDEN:", s: "Het kind kocht een ijsje bij de kraam op het plein", a: ["Het",
  "een", "de", "het"]},
      {t: "mc", i: "Wat is een stoffelijk bijvoeglijk naamwoord?", o: ["Mooi", "Houten", "Groot", "Zacht"], c:
  "Houten"},
      {t: "id", i: "Klik op de 2 STOFFELIJKE bijvoeglijke naamwoorden:", s: "Op de glazen tafel stond een zilveren
  schaal", a: ["glazen", "zilveren"]},
      {t: "id", i: "Klik op de ZELFSTANDIGE NAAMWOORDEN:", s: "De meester schreef met een rood krijtje op het bord", a:
  ["meester", "krijtje", "bord"]},
      {t: "mc", i: "Is 'het' hier een lidwoord: 'Ik zag het meisje'?", o: ["Ja", "Nee"], c: "Ja"},
      {t: "id", i: "Klik op de BIJVOEGLIJKE NAAMWOORDEN:", s: "De metalen deur bleef de hele middag gesloten", a:
  ["metalen", "hele"]},
      {t: "mc", i: "Wat is 'de blinde' in: 'De blinde liep daar'?", o: ["Bijvoeglijk naamwoord", "Zelfstandig gebruikt
  bijvoeglijk naamwoord"], c: "Zelfstandig gebruikt bijvoeglijk naamwoord"},
      {t: "id", i: "Klik op de 3 LIDWOORDEN:", s: "De leerling opende een raam in het lokaal", a: ["De", "een", "het"]},
      {t: "id", i: "Klik op de ZELFSTANDIGE NAAMWOORDEN:", s: "Mijn zusje Emma speelt met haar nieuwe pop in de tuin",
  a: ["zusje", "Emma", "pop", "tuin"]},
      {t: "mc", i: "Wat is GEEN zelfstandig naamwoord?", o: ["Stoel", "Fietsen", "Computer"], c: "Fietsen"},
      {t: "id", i: "Klik op de 3 BIJVOEGLIJKE NAAMWOORDEN:", s: "Die snelle scooter reed door de smalle straat op een
  regenachtige dag", a: ["snelle", "smalle", "regenachtige"]},
      {t: "mc", i: "Wat is 'drinken' in: 'Het drinken van melk'?", o: ["Werkwoord", "Zelfstandig naamwoord"], c:
  "Zelfstandig naamwoord"},
      {t: "id", i: "Klik op de LIDWOORDEN en de ZELFSTANDIGE NAAMWOORDEN:", s: "De plastic beker viel van de houten
  tafel", a: ["De", "beker", "de", "tafel"]},
      {t: "mc", i: "Wat is 'gouden'?", o: ["Lidwoord", "Stoffelijk bijvoeglijk naamwoord"], c: "Stoffelijk bijvoeglijk
  naamwoord"},
      {t: "id", i: "Klik op de BIJVOEGLIJKE NAAMWOORDEN:", s: "In de donkere kast lag een klein blauw doosje", a:
  ["donkere", "klein", "blauw"]},
      {t: "mc", i: "Welk lidwoord hoort bij 'kussen'?", o: ["De", "Het"], c: "Het"},
      {t: "id", i: "Klik op de ZELFSTANDIGE NAAMWOORDEN:", s: "De hond haalde de krant uit de brievenbus", a: ["hond",
  "krant", "brievenbus"]},
      {t: "id", i: "Klik op de LW, de ZN en de BN:", s: "Een sterke man tilde de zware koffer op het perron", a: ["Een",
  "sterke", "man", "de", "zware", "koffer", "het", "perron"]}
  ];

  var teller = 0;
  var score = 0;
  var keuzes = [];
  var mcKeuze = null;
  var isKlaar = false;

  // Wachten tot alles geladen is
  window.onload = function() {
      document.getElementById("knop-start").onclick = startQuiz;
      document.getElementById("knop-actie").onclick = check;
  };

  function startQuiz() {
      document.getElementById("scherm-start").style.display = "none";
      document.getElementById("scherm-vraag").style.display = "block";
      toonVraag();
  }

  function toonVraag() {
      isKlaar = false;
      keuzes = [];
      mcKeuze = null;
      var v = vragen[teller];

      document.getElementById("v-num").innerHTML = teller + 1;
      document.getElementById("v-tekst").innerHTML = v.i;
      document.getElementById("v-feedback").style.display = "none";
      document.getElementById("knop-actie").innerHTML = "Controleren";

      var gebied = document.getElementById("v-gebied");
      gebied.innerHTML = "";

      if (v.t === "id") {
          var woorden = v.s.split(" ");
          for (var i = 0; i < woorden.length; i++) {
              var s = document.createElement("span");
              s.className = "word";
              s.innerHTML = woorden[i];
              s.onclick = function() {
                  if (isKlaar) return;
                  this.classList.toggle("selected");
                  var tekst = this.innerHTML;
                  var plek = keuzes.indexOf(tekst);
                  if (plek > -1) keuzes.splice(plek, 1);
                  else keuzes.push(tekst);
              };
              gebied.appendChild(s);
          }
      } else {
          for (var j = 0; j < v.o.length; j++) {
              var b = document.createElement("button");
              b.className = "optie";
              b.innerHTML = v.o[j];
              b.onclick = function() {
                  if (isKlaar) return;
                  var alle = document.getElementsByClassName("optie");
                  for (var k = 0; k < alle.length; k++) alle[k].style.background = "white";
                  this.style.background = "#eef";
                  mcKeuze = this.innerHTML;
              };
              gebied.appendChild(b);
          }
      }
  }

  function check() {
      if (isKlaar) {
          volgende();
          return;
      }

      var v = vragen[teller];
      var goed = false;

      if (v.t === "id") {
          if (keuzes.length === v.a.length) {
              var match = 0;
              for (var i = 0; i < keuzes.length; i++) {
                  for (var j = 0; j < v.a.length; j++) {
                      if (keuzes[i].toLowerCase() === v.a[j].toLowerCase()) match++;
                  }
              }
              if (match === v.a.length) goed = true;
          }
      } else {
          if (mcKeuze === v.c) goed = true;
      }

      var f = document.getElementById("v-feedback");
      f.style.display = "block";
      if (goed) {
          score++;
          f.className = "feedback goed";
          f.innerHTML = "Goed gedaan!";
      } else {
          f.className = "feedback fout";
          f.innerHTML = "Helaas, dat is niet juist.";
      }

      isKlaar = true;
      document.getElementById("knop-actie").innerHTML = (teller < 19) ? "Volgende" : "Resultaat";
  }

  function volgende() {
      teller++;
      if (teller < 20) toonVraag();
      else einde();
  }

  function einde() {
      document.getElementById("scherm-vraag").style.display = "none";
      document.getElementById("scherm-einde").style.display = "block";
      document.getElementById("eind-score").innerHTML = score + " van de 20";
  }
  </script>

  </body>
  </html>
