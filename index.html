  <!DOCTYPE html>
  <html lang="nl">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Grammatica Meester | Concrete Woordsoorten</title>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
      <style>
          :root {
              --primary: #6366f1;
              --primary-dark: #4f46e5;
              --accent: #f59e0b;
              --success: #10b981;
              --error: #ef4444;
              --bg: #f8fafc;
              --text-main: #1e293b;
              --text-muted: #64748b;
              --radius: 16px;
              --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
          }

          * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

          body {
              font-family: 'Inter', sans-serif;
              background-color: #0f172a;
              background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
                                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
              color: var(--text-main);
              display: flex;
              justify-content: center;
              align-items: center;
              min-height: 100vh;
              margin: 0;
              padding: 20px;
          }

          #quiz-app {
              background: rgba(255, 255, 255, 0.98);
              max-width: 650px;
              width: 100%;
              padding: 40px;
              border-radius: var(--radius);
              box-shadow: var(--shadow);
              position: relative;
          }

          .progress-container {
              position: absolute;
              top: 0; left: 0; width: 100%; height: 6px;
              background: #e2e8f0;
              border-radius: var(--radius) var(--radius) 0 0;
          }
          #progress-bar {
              height: 100%; width: 0%;
              background: linear-gradient(90deg, var(--primary), var(--success));
              transition: width 0.4s ease;
          }

          .header { text-align: center; margin-bottom: 30px; }
          h1 { font-weight: 800; color: var(--primary-dark); margin: 0; }

          .stats-bar {
              display: flex; justify-content: space-between; align-items: center;
              margin-bottom: 25px; padding: 12px;
              background: #f1f5f9; border-radius: 12px; font-weight: 600;
          }

          .sentence-box {
              background: white; padding: 25px; border-radius: 12px;
              border: 2px solid #e2e8f0; line-height: 2.8; font-size: 1.25rem;
              margin-bottom: 25px;
          }

          .word {
              display: inline-block; padding: 0 6px; margin: 0 2px;
              cursor: pointer; border-radius: 6px; transition: 0.2s;
          }
          .word:hover { background: #e0e7ff; color: var(--primary); }
          .word.selected { background: var(--primary); color: white; }

          .options-grid { display: flex; flex-direction: column; gap: 10px; }
          .option-btn {
              padding: 16px; text-align: left; background: white;
              border: 2px solid #e2e8f0; border-radius: 12px;
              cursor: pointer; font-size: 1rem; font-family: inherit;
          }
          .option-btn:hover { border-color: var(--primary); background: #f8faff; }
          .option-btn.selected { border-color: var(--primary); background: #e0e7ff; }

          .feedback {
              margin-top: 20px; padding: 15px; border-radius: 12px;
              display: none; font-size: 0.95rem; line-height: 1.4;
          }
          .feedback.correct { background: #ecfdf5; color: #065f46; border-left: 5px solid var(--success); }
          .feedback.wrong { background: #fef2f2; color: #991b1b; border-left: 5px solid var(--error); }

          .main-btn {
              width: 100%; background: var(--primary); color: white;
              border: none; padding: 18px; border-radius: 12px;
              cursor: pointer; font-size: 1.1rem; font-weight: 700;
              box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
          }
          .main-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }

          .grade-circle {
              width: 120px; height: 120px; margin: 20px auto;
              border-radius: 50%; border: 6px solid var(--primary);
              display: flex; flex-direction: column; justify-content: center; align-items: center;
          }
          .grade-val { font-size: 2.5rem; font-weight: 800; }
      </style>
  </head>
  <body>

  <div id="quiz-app">
      <div class="progress-container"><div id="progress-bar"></div></div>

      <!-- Start -->
      <div id="start-screen">
          <div class="header">
              <h1>Grammatica Meester</h1>
              <p>VWO 1 • Concrete Woordsoorten</p>
          </div>
          <p>Test je kennis van <b>lidwoorden</b>, <b>zelfstandige naamwoorden</b> en <b>bijvoeglijke
  naamwoorden</b>.</p>
          <button class="main-btn" onclick="startQuiz()">Start de Quiz</button>
      </div>

      <!-- Quiz -->
      <div id="quiz-screen" style="display:none;">
          <div class="stats-bar">
              <span>Vraag <span id="q-num">1</span>/20</span>
              <span id="score-text">Score: 0</span>
          </div>
          <p id="instruction" style="font-weight:600; margin-bottom:15px;"></p>
          <div id="interactive-container"></div>
          <div id="feedback-box" class="feedback"></div>
          <button id="action-btn" class="main-btn" onclick="checkAnswer()" style="margin-top:20px;">Controleren</button>
      </div>

      <!-- Result -->
      <div id="result-screen" style="display:none; text-align:center;">
          <h1>Klaar!</h1>
          <div class="grade-circle">
              <span style="font-size:0.7rem; color:var(--text-muted)">CIJFER</span>
              <span class="grade-val" id="final-grade">0.0</span>
          </div>
          <p id="stats-summary"></p>
          <button class="main-btn" onclick="location.reload()">Opnieuw</button>
      </div>
  </div>

  <!-- Scripts onderaan voor betere werking -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
      const questions = [
          { type: "identify", instruction: "Klik op de drie <b>ZELFSTANDIGE NAAMWOORDEN</b>:", sentence: "De jonge
  voetballer trapte de bal over het witte hek.", answers: ["voetballer", "bal", "hek"], why: "Voetballer, bal en hek
  zijn tastbare dingen en personen." },
          { type: "identify", instruction: "Klik op alle <b>BIJVOEGLIJKE NAAMWOORDEN</b>:", sentence: "In de grote
  rugzak zaten twee zware, dikke boeken.", answers: ["grote", "zware", "dikke"], why: "Grote, zware en dikke geven extra
  informatie over de rugzak en de boeken." },
          { type: "identify", instruction: "Klik op alle <b>LIDWOORDEN</b>:", sentence: "Het kind kocht een ijsje bij de
  kraam op het plein.", answers: ["Het", "een", "de", "het"], why: "Lidwoorden: het, een, de en nogmaals het." },
          { type: "mc", instruction: "Welk woord is een <b>stoffelijk</b> bijvoeglijk naamwoord?", options: ["Mooi",
  "Houten", "Groot", "Zacht"], correct: "Houten", why: "Houten zegt van welke stof iets gemaakt is (hout)." },
          { type: "identify", instruction: "Klik op de twee <b>STOFFELIJKE</b> bijvoeglijke naamwoorden:", sentence: "Op
  de glazen tafel stond een zilveren schaal.", answers: ["glazen", "zilveren"], why: "Glazen en zilveren vertellen van
  welk materiaal de tafel en de schaal zijn gemaakt." },
          { type: "identify", instruction: "Klik op de <b>ZELFSTANDIGE NAAMWOORDEN</b>:", sentence: "De meester schreef
  met een rood krijtje op het bord.", answers: ["meester", "krijtje", "bord"], why: "Dit zijn drie tastbare zaken: een
  persoon en twee voorwerpen." },
          { type: "mc", instruction: "Is 'het' in deze zin een lidwoord? <br><i>'Ik zag het meisje gisteren.'</i>",
  options: ["Ja, het is een lidwoord bij 'meisje'.", "Nee, het is een voornaamwoord.", "Ja, het is een bijvoeglijk
  naamwoord."], correct: "Ja, het is een lidwoord bij 'meisje'.", why: "Hier staat 'het' direct voor het zelfstandig
  naamwoord 'meisje'." },
          { type: "identify", instruction: "Wijs alle <b>BIJVOEGLIJKE NAAMWOORDEN</b> aan:", sentence: "De metalen deur
  bleef de hele middag gesloten.", answers: ["metalen", "hele"], why: "Metalen (stof) en hele zeggen iets over de deur
  en de middag." },
          { type: "mc", instruction: "Wat is 'de blinde' in de zin: 'De blinde liep met een stok'?", options: ["Een
  gewoon bijvoeglijk naamwoord.", "Een zelfstandig gebruikt bijvoeglijk naamwoord.", "Een lidwoord."], correct: "Een
  zelfstandig gebruikt bijvoeglijk naamwoord.", why: "Blinde is normaal een eigenschap, maar hier wordt het als persoon
  (zelfstandig) gebruikt." },
          { type: "identify", instruction: "Klik op de drie <b>LIDWOORDEN</b>:", sentence: "De leerling opende een raam
  in het lokaal.", answers: ["De", "een", "het"], why: "De, een en het zijn de drie Nederlandse lidwoorden." },
          { type: "identify", instruction: "Klik op de <b>ZELFSTANDIGE NAAMWOORDEN</b> (inclusief eigennamen):",
  sentence: "Mijn zusje Emma speelt met haar nieuwe pop in de tuin.", answers: ["zusje", "Emma", "pop", "tuin"], why:
  "Eigennamen (Emma) zijn ook altijd zelfstandige naamwoorden." },
          { type: "mc", instruction: "Welk woord is <b>GEEN</b> zelfstandig naamwoord?", options: ["Stoel", "Fietsen",
  "Computer", "Bord"], correct: "Fietsen", why: "Fietsen is een werkwoord (behalve als je 'de fietsen' bedoelt, maar
  hier is het de actie)." },
          { type: "identify", instruction: "Klik op de drie <b>BIJVOEGLIJKE NAAMWOORDEN</b>:", sentence: "Die snelle
  scooter reed door de smalle straat op een regenachtige dag.", answers: ["snelle", "smalle", "regenachtige"], why:
  "Deze woorden beschrijven de eigenschappen van de scooter, de straat en de dag." },
          { type: "mc", instruction: "In 'Het drinken van de melk', wat is het woord <b>'drinken'</b>?", options: ["Een
  werkwoord", "Een zelfstandig naamwoord", "Een bijvoeglijk naamwoord"], correct: "Een zelfstandig naamwoord", why:
  "Door het lidwoord 'het' wordt de actie een ding (het drinken)." },
          { type: "identify", instruction: "Klik op de <b>LIDWOORDEN</b> en de <b>ZELFST. NAAMWOORDEN</b>:", sentence:
  "De plastic beker viel van de houten tafel.", answers: ["De", "beker", "de", "tafel"], why: "Lidwoorden: de, de.
  Zelfst. naamwoorden: beker, tafel. (Plastic en houten zijn bijv. naamwoorden)." },
          { type: "mc", instruction: "Wat is 'gouden' in de zin: 'De gouden ring glom in de zon'?", options:
  ["Zelfstandig naamwoord", "Stoffelijk bijvoeglijk naamwoord", "Lidwoord"], correct: "Stoffelijk bijvoeglijk
  naamwoord", why: "Het zegt waarvan de ring gemaakt is." },
          { type: "identify", instruction: "Klik op de <b>BIJVOEGLIJKE NAAMWOORDEN</b>:", sentence: "In de donkere kast
  lag een klein, blauw doosje.", answers: ["donkere", "klein", "blauw"], why: "Deze woorden geven de kleur, grootte en
  staat van de kast en het doosje aan." },
          { type: "mc", instruction: "Welk lidwoord hoort bij het woord <b>'kussen'</b> (het ding op je bed)?", options:
  ["De", "Het", "Geen van beide"], correct: "Het", why: "Het is 'het kussen'." },
          { type: "identify", instruction: "Klik op de <b>ZELFSTANDIGE NAAMWOORDEN</b>:", sentence: "De hond haalde de
  krant uit de brievenbus.", answers: ["hond", "krant", "brievenbus"], why: "Hond, krant en brievenbus zijn alle drie
  tastbaar." },
          { type: "identify", instruction: "De laatste vraag! Klik op de <b>LW</b>, de <b>ZN</b> en de <b>BN</b>:",
  sentence: "Een sterke man tilde de zware koffer op het perron.", answers: ["Een", "sterke", "man", "de", "zware",
  "koffer", "het", "perron"], why: "Lidw: een, de, het. Bijv. nw: sterke, zware. Zelfst. nw: man, koffer, perron." }
      ];

      let state = {
          current: 0,
          score: 0,
          userPicks: [],
          mcPick: null,
          answered: false
      };

      function startQuiz() {
          document.getElementById('start-screen').style.display = 'none';
          document.getElementById('quiz-screen').style.display = 'block';
          showQuestion();
      }

      function showQuestion() {
          state.answered = false;
          state.userPicks = [];
          state.mcPick = null;

          const q = questions[state.current];
          document.getElementById('q-num').innerText = state.current + 1;
          document.getElementById('instruction').innerHTML = q.instruction;
          document.getElementById('feedback-box').style.display = 'none';
          document.getElementById('action-btn').innerText = "Controleren";
          document.getElementById('progress-bar').style.width = (state.current / questions.length * 100) + "%";

          const container = document.getElementById('interactive-container');
          container.innerHTML = '';

          if (q.type === 'identify') {
              const box = document.createElement('div');
              box.className = 'sentence-box';
              q.sentence.split(' ').forEach(word => {
                  const clean = word.replace(/[.,!?;:]/g, "");
                  const span = document.createElement('span');
                  span.className = 'word';
                  span.innerText = word;
                  span.onclick = () => {
                      if (state.answered) return;
                      span.classList.toggle('selected');
                      if (span.classList.contains('selected')) state.userPicks.push(clean);
                      else state.userPicks = state.userPicks.filter(w => w !== clean);
                  };
                  box.appendChild(span);
                  box.appendChild(document.createTextNode(' '));
              });
              container.appendChild(box);
          } else {
              const grid = document.createElement('div');
              grid.className = 'options-grid';
              q.options.forEach(opt => {
                  const btn = document.createElement('button');
                  btn.className = 'option-btn';
                  btn.innerText = opt;
                  btn.onclick = () => {
                      if (state.answered) return;
                      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                      btn.classList.add('selected');
                      state.mcPick = opt;
                  };
                  grid.appendChild(btn);
              });
              container.appendChild(grid);
          }
      }

      function checkAnswer() {
          if (state.answered) {
              nextQuestion();
              return;
          }

          const q = questions[state.current];
          let correct = false;

          if (q.type === 'identify') {
              const answers = q.answers.map(a => a.toLowerCase());
              const user = state.userPicks.map(u => u.toLowerCase());
              correct = answers.length === user.length && answers.every(a => user.includes(a));
          } else {
              correct = state.mcPick === q.correct;
          }

          const fb = document.getElementById('feedback-box');
          fb.style.display = 'block';
          if (correct) {
              state.score++;
              fb.className = 'feedback correct';
              fb.innerHTML = "<b>Goed gedaan!</b><br>" + q.why;
          } else {
              fb.className = 'feedback wrong';
              fb.innerHTML = "<b>Helaas...</b><br>" + q.why;
          }

          document.getElementById('score-text').innerText = "Score: " + state.score;
          state.answered = true;
          document.getElementById('action-btn').innerText = (state.current < questions.length - 1) ? "Volgende vraag" :
  "Eindresultaat";
      }

      function nextQuestion() {
          state.current++;
          if (state.current < questions.length) showQuestion();
          else showFinal();
      }

      function showFinal() {
          document.getElementById('quiz-screen').style.display = 'none';
          document.getElementById('result-screen').style.display = 'block';
          document.getElementById('progress-bar').style.width = "100%";

          const grade = (state.score / questions.length * 9 + 1).toFixed(1);
          document.getElementById('final-grade').innerText = grade;
          document.getElementById('stats-summary').innerText = `Je had ${state.score} van de 20 vragen goed.`;

          if (grade >= 7.5 && typeof confetti === 'function') {
              confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
          }
      }
  </script>
  </body>
  </html>
