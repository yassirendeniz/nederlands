<!DOCTYPE html>
  <html lang="nl">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Grammatica Meester</title>
      <!-- We laden het lettertype via een betrouwbare link -->
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
      <style>
          :root {
              --primary: #6366f1;
              --primary-dark: #4f46e5;
              --success: #10b981;
              --error: #ef4444;
              --bg: #f1f5f9;
              --card: #ffffff;
              --text: #1e293b;
          }

          * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

          body {
              font-family: 'Inter', sans-serif;
              background-color: var(--bg);
              background-image: radial-gradient(at 0% 0%, hsla(253,16%,15%,1) 0, transparent 50%),
                                radial-gradient(at 100% 0%, hsla(225,39%,25%,1) 0, transparent 50%);
              background-attachment: fixed;
              color: var(--text);
              display: flex;
              justify-content: center;
              align-items: center;
              min-height: 100vh;
              margin: 0;
              padding: 20px;
          }

          #quiz-app {
              background: var(--card);
              max-width: 650px;
              width: 100%;
              padding: 40px;
              border-radius: 24px;
              box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
              position: relative;
              overflow: hidden;
          }

          /* Voortgangsbalk bovenaan */
          .progress-container {
              position: absolute;
              top: 0; left: 0; width: 100%; height: 6px;
              background: #e2e8f0;
          }
          #progress-bar {
              height: 100%; width: 0%;
              background: linear-gradient(90deg, var(--primary), var(--success));
              transition: width 0.4s ease;
          }

          .header h1 { font-size: 1.8rem; font-weight: 800; margin: 0; color: var(--primary-dark); }
          .header p { color: #64748b; margin: 10px 0 30px 0; font-size: 0.9rem; }

          .stats-bar {
              display: flex; justify-content: space-between;
              margin-bottom: 25px; padding: 12px 20px;
              background: #f8fafc; border-radius: 12px;
              font-weight: 600; font-size: 0.85rem; color: #64748b;
              border: 1px solid #e2e8f0;
          }

          .question-text { font-size: 1.1rem; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }

          /* De zin met woorden */
          .sentence-box {
              background: #ffffff; padding: 25px; border-radius: 16px;
              border: 2px solid #e2e8f0; line-height: 2.8; font-size: 1.25rem;
              margin-bottom: 25px; text-align: left;
          }

          .word {
              display: inline-block; padding: 0 6px; margin: 0 2px;
              cursor: pointer; border-radius: 6px; transition: 0.2s;
              border: 1px solid transparent;
          }
          .word:hover { background: #eef2ff; color: var(--primary); }
          .word.selected { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(99,102,241,0.3); }

          /* Meerkeuze knoppen */
          .options-grid { display: flex; flex-direction: column; gap: 10px; }
          .option-btn {
              padding: 16px; text-align: left; background: white;
              border: 2px solid #e2e8f0; border-radius: 12px;
              cursor: pointer; font-size: 1rem; font-family: inherit;
              transition: 0.2s;
          }
          .option-btn:hover { border-color: var(--primary); background: #f8faff; }
          .option-btn.selected { border-color: var(--primary); background: #eef2ff; font-weight: 600; }

          /* Feedback box */
          .feedback {
              margin-top: 20px; padding: 18px; border-radius: 12px;
              display: none; line-height: 1.5; font-size: 0.95rem;
          }
          .feedback.correct { background: #ecfdf5; color: #065f46; border-left: 5px solid var(--success); }
          .feedback.wrong { background: #fef2f2; color: #991b1b; border-left: 5px solid var(--error); }

          /* Hoofdknop */
          .main-btn {
              background: var(--primary); color: white; border: none;
              padding: 16px; border-radius: 12px; cursor: pointer;
              font-size: 1.1rem; font-weight: 700; width: 100%;
              transition: 0.3s; box-shadow: 0 10px 15px -3px rgba(99,102,241,0.3);
          }
          .main-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }

          /* Resultaat */
          .grade-box { margin: 20px 0; }
          .grade-num { font-size: 4rem; font-weight: 900; color: var(--primary); margin: 0; }

          .list-style { text-align: left; margin: 20px 0; padding: 0; list-style: none; }
          .list-style li { padding: 8px 0; color: #475569; }
          .list-style li:before { content: "• "; color: var(--primary); font-weight: bold; }
      </style>
  </head>
  <body>

  <div id="quiz-app">
      <div class="progress-container"><div id="progress-bar"></div></div>

      <!-- START SCHERM -->
      <div id="start-screen">
          <div class="header">
              <h1>Grammatica Meester</h1>
              <p>VWO 1 Niveau • Concrete Woordsoorten</p>
          </div>
          <p>Test je kennis van de volgende onderdelen:</p>
          <ul class="list-style">
              <li>Lidwoorden (de, het, een)</li>
              <li>Zelfstandige naamwoorden (tastbare dingen)</li>
              <li>Bijvoeglijke naamwoorden (eigenschappen)</li>
          </ul>
          <button class="main-btn" onclick="startQuiz()">Start de Quiz</button>
      </div>

      <!-- QUIZ SCHERM -->
      <div id="quiz-screen" style="display:none;">
          <div class="stats-bar">
              <span>Vraag <span id="q-num">1</span> van 20</span>
              <span>Score: <span id="score-display">0</span></span>
          </div>
          <div id="content">
              <p class="question-text" id="instruction"></p>
              <div id="interactive-container"></div>
              <div id="feedback-box" class="feedback"></div>
          </div>
          <div class="controls" style="margin-top:25px;">
              <button id="action-btn" class="main-btn" onclick="check()">Controleren</button>
          </div>
      </div>

      <!-- RESULTAAT SCHERM -->
      <div id="result-screen" style="display:none; text-align: center;">
          <div class="header">
              <h1>Klaar!</h1>
              <p>Je hebt de toets afgerond.</p>
          </div>
          <div class="grade-box">
              <p style="font-weight: 700; color: #64748b; margin-bottom: 0;">CIJFER</p>
              <p class="grade-num" id="final-grade">0.0</p>
          </div>
          <p id="stats-summary" style="font-weight: 600;"></p>
          <button class="main-btn" onclick="location.reload()" style="margin-top:20px;">Opnieuw proberen</button>
      </div>
  </div>

  <script>
      // Data (Precies dezelfde vragen als gevraagd)
      var questions = [
          { type: "identify", instruction: "Klik op de drie <b>ZELFSTANDIGE NAAMWOORDEN</b>:", sentence: "De jonge
  voetballer trapte de bal over het witte hek.", answers: ["voetballer", "bal", "hek"], why: "Voetballer, bal en hek
  zijn tastbare dingen en personen." },
          { type: "identify", instruction: "Klik op alle <b>BIJVOEGLIJKE NAAMWOORDEN</b>:", sentence: "In de grote
  rugzak zaten twee zware, dikke boeken.", answers: ["grote", "zware", "dikke"], why: "Grote, zware en dikke geven extra
  informatie over de rugzak en de boeken." },
          { type: "identify", instruction: "Klik op alle <b>LIDWOORDEN</b>:", sentence: "Het kind kocht een ijsje bij de
  kraam op het plein.", answers: ["Het", "een", "de", "het"], why: "Lidwoorden: het, een, de en nogmaals het." },
          { type: "mc", instruction: "Welk woord is een <b>stoffelijk</b> bijvoeglijk naamwoord?", options: ["Mooi",
  "Houten", "Groot", "Zacht"], correct: "Houten", why: "Houten zegt van welke stof iets gemaakt is (hout)." },
          { type: "identify", instruction: "Klik op de twee <b>STOFFELIJKE</b> bijvoeglijke naamwoorden:", sentence: "Op
  de glazen tafel stond een zilveren schaal.", answers: ["glazen", "zilveren"], why: "Glazen en zilveren vertellen van
  welk materiaal de tafel en de schaal zijn gemaakt." },
          { type: "identify", instruction: "Klik op de <b>ZELFSTANDIGE NAAMWOORDEN</b>:", sentence: "De meester schreef
  met een rood krijtje op het bord.", answers: ["meester", "krijtje", "bord"], why: "Dit zijn drie tastbare zaken: een
  persoon en twee voorwerpen." },
          { type: "mc", instruction: "Is 'het' in deze zin een lidwoord? <br><i>'Ik zag het meisje gisteren.'</i>",
  options: ["Ja, het is een lidwoord bij 'meisje'.", "Nee, het is een voornaamwoord.", "Ja, het is een bijvoeglijk
  naamwoord."], correct: "Ja, het is een lidwoord bij 'meisje'.", why: "Hier staat 'het' direct voor het zelfstandig
  naamwoord 'meisje'." },
          { type: "identify", instruction: "Wijs alle <b>BIJVOEGLIJKE NAAMWOORDEN</b> aan:", sentence: "De metalen deur
  bleef de hele middag gesloten.", answers: ["metalen", "hele"], why: "Metalen (stof) en hele zeggen iets over de deur
  en de middag." },
          { type: "mc", instruction: "Wat is 'de blinde' in de zin: 'De blinde liep met een stok'?", options: ["Een
  gewoon bijvoeglijk naamwoord.", "Een zelfstandig gebruikt bijvoeglijk naamwoord.", "Een lidwoord."], correct: "Een
  zelfstandig gebruikt bijvoeglijk naamwoord.", why: "Blinde is normaal een eigenschap, maar hier wordt het als persoon
  (zelfstandig) gebruikt." },
          { type: "identify", instruction: "Klik op de drie <b>LIDWOORDEN</b>:", sentence: "De leerling opende een raam
  in het lokaal.", answers: ["De", "een", "het"], why: "De, een en het zijn de drie Nederlandse lidwoorden." },
          { type: "identify", instruction: "Klik op de <b>ZELFSTANDIGE NAAMWOORDEN</b> (inclusief eigennamen):",
  sentence: "Mijn zusje Emma speelt met haar nieuwe pop in de tuin.", answers: ["zusje", "Emma", "pop", "tuin"], why:
  "Eigennamen (Emma) zijn ook altijd zelfstandige naamwoorden." },
          { type: "mc", instruction: "Welk woord is <b>GEEN</b> zelfstandig naamwoord?", options: ["Stoel", "Fietsen",
  "Computer", "Bord"], correct: "Fietsen", why: "Fietsen is een werkwoord (behalve als je 'de fietsen' bedoelt, maar
  hier is het de actie)." },
          { type: "identify", instruction: "Klik op de drie <b>BIJVOEGLIJKE NAAMWOORDEN</b>:", sentence: "Die snelle
  scooter reed door de smalle straat op een regenachtige dag.", answers: ["snelle", "smalle", "regenachtige"], why:
  "Deze woorden beschrijven de eigenschappen van de scooter, de straat en de dag." },
          { type: "mc", instruction: "In 'Het drinken van de melk', wat is het woord <b>'drinken'</b>?", options: ["Een
  werkwoord", "Een zelfstandig naamwoord", "Een bijvoeglijk naamwoord"], correct: "Een zelfstandig naamwoord", why:
  "Door het lidwoord 'het' wordt de actie een ding (het drinken)." },
          { type: "identify", instruction: "Klik op de <b>LIDWOORDEN</b> en de <b>ZELFST. NAAMWOORDEN</b>:", sentence:
  "De plastic beker viel van de houten tafel.", answers: ["De", "beker", "de", "tafel"], why: "Lidwoorden: de, de.
  Zelfst. naamwoorden: beker, tafel. (Plastic en houten zijn bijv. naamwoorden)." },
          { type: "mc", instruction: "Wat is 'gouden' in de zin: 'De gouden ring glom in de zon'?", options:
  ["Zelfstandig naamwoord", "Stoffelijk bijvoeglijk naamwoord", "Lidwoord"], correct: "Stoffelijk bijvoeglijk
  naamwoord", why: "Het zegt waarvan de ring gemaakt is." },
          { type: "identify", instruction: "Klik op de <b>BIJVOEGLIJKE NAAMWOORDEN</b>:", sentence: "In de donkere kast
  lag een klein, blauw doosje.", answers: ["donkere", "klein", "blauw"], why: "Deze woorden geven de kleur, grootte en
  staat van de kast en het doosje aan." },
          { type: "mc", instruction: "Welk lidwoord hoort bij het woord <b>'kussen'</b> (het ding op je bed)?", options:
  ["De", "Het", "Geen van beide"], correct: "Het", why: "Het is 'het kussen'." },
          { type: "identify", instruction: "Klik op de <b>ZELFSTANDIGE NAAMWOORDEN</b>:", sentence: "De hond haalde de
  krant uit de brievenbus.", answers: ["hond", "krant", "brievenbus"], why: "Hond, krant en brievenbus zijn alle drie
  tastbaar." },
          { type: "identify", instruction: "De laatste vraag! Klik op de <b>LW</b>, de <b>ZN</b> en de <b>BN</b>:",
  sentence: "Een sterke man tilde de zware koffer op het perron.", answers: ["Een", "sterke", "man", "de", "zware",
  "koffer", "het", "perron"], why: "Lidw: een, de, het. Bijv. nw: sterke, zware. Zelfst. nw: man, koffer, perron." }
      ];

      var currentQ = 0;
      var score = 0;
      var userSelections = [];
      var mcSelection = null;
      var isAnswered = false;

      function startQuiz() {
          document.getElementById('start-screen').style.display = 'none';
          document.getElementById('quiz-screen').style.display = 'block';
          showQuestion();
      }

      function showQuestion() {
          isAnswered = false;
          var q = questions[currentQ];
          document.getElementById('q-num').innerText = currentQ + 1;
          document.getElementById('instruction').innerHTML = q.instruction;
          document.getElementById('feedback-box').style.display = 'none';
          document.getElementById('action-btn').innerText = "Controleren";

          // Progress Bar
          document.getElementById('progress-bar').style.width = (currentQ / questions.length * 100) + "%";

          var container = document.getElementById('interactive-container');
          container.innerHTML = '';
          userSelections = [];
          mcSelection = null;

          if (q.type === 'identify') {
              var box = document.createElement('div');
              box.className = 'sentence-box';
              var words = q.sentence.split(' ');
              for (var i = 0; i < words.length; i++) {
                  (function(wordStr) {
                      var span = document.createElement('span');
                      span.className = 'word';
                      span.innerText = wordStr;
                      span.onclick = function() {
                          if (isAnswered) return;
                          var clean = wordStr.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
                          if (span.classList.contains('selected')) {
                              span.classList.remove('selected');
                              userSelections = userSelections.filter(function(w) { return w !== clean; });
                          } else {
                              span.classList.add('selected');
                              userSelections.push(clean);
                          }
                      };
                      box.appendChild(span);
                  })(words[i]);
              }
              container.appendChild(box);
          } else {
              var grid = document.createElement('div');
              grid.className = 'options-grid';
              for (var j = 0; j < q.options.length; j++) {
                  (function(opt) {
                      var btn = document.createElement('button');
                      btn.className = 'option-btn';
                      btn.innerText = opt;
                      btn.onclick = function() {
                          if (isAnswered) return;
                          var all = document.getElementsByClassName('option-btn');
                          for (var k = 0; k < all.length; k++) {
                              all[k].classList.remove('selected');
                          }
                          btn.classList.add('selected');
                          mcSelection = opt;
                      };
                      grid.appendChild(btn);
                  })(q.options[j]);
              }
              container.appendChild(grid);
          }
      }

      function check() {
          if (isAnswered) {
              next();
              return;
          }

          var q = questions[currentQ];
          var correct = false;

          if (q.type === 'identify') {
              var lowerAnswers = q.answers.map(function(a) { return a.toLowerCase(); });
              var lowerUser = userSelections.map(function(u) { return u.toLowerCase(); });
              correct = lowerAnswers.length === lowerUser.length && lowerAnswers.every(function(a) { return
  lowerUser.indexOf(a) !== -1; });
          } else {
              correct = (mcSelection === q.correct);
          }

          var fb = document.getElementById('feedback-box');
          if (correct) {
              score++;
              fb.className = 'feedback correct';
              fb.innerHTML = "<b>Goed gedaan!</b><br>" + q.why;
          } else {
              fb.className = 'feedback wrong';
              fb.innerHTML = "<b>Helaas...</b><br>" + q.why;
          }
          fb.style.display = 'block';
          document.getElementById('score-display').innerText = score;
          isAnswered = true;
          document.getElementById('action-btn').innerText = (currentQ < questions.length - 1) ? "Volgende" :
  "Resultaat";
      }

      function next() {
          currentQ++;
          if (currentQ < questions.length) showQuestion();
          else showResults();
      }

      function showResults() {
          document.getElementById('quiz-screen').style.display = 'none';
          document.getElementById('result-screen').style.display = 'block';
          document.getElementById('progress-bar').style.width = "100%";
          var grade = (score / questions.length * 9 + 1).toFixed(1);
          document.getElementById('final-grade').innerText = grade;
          document.getElementById('stats-summary').innerText = "Je had " + score + " van de 20 vragen goed!";
      }
  </script>
  </body>
  </html>
